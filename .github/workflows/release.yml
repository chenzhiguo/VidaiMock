name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: vidaimock-linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: vidaimock-linux-arm64
            archive_ext: tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: vidaimock-macos-x64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: vidaimock-macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: vidaimock-windows-x64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build with Cross
        if: matrix.use_cross
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo install cross
          cross build --release --target "$TARGET"

      - name: Build with Cargo (non-cross)
        if: "!matrix.use_cross"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --target "$TARGET"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'

      # Build a no-Rekor signing config once per job — reused by the
      # binary-sign and tarball-sign steps below. cosign v2.5+ rejects
      # --tlog-upload=false combined with the default signing-config,
      # so we follow the Vidai Deployment repo's workaround: emit a
      # custom signing-config with no Rekor URLs and pass it via
      # --signing-config.
      - name: Prepare cosign signing config (no Rekor)
        shell: bash
        run: |
          set -euo pipefail
          SIG_CFG="${RUNNER_TEMP}/cosign-signing-config-no-rekor.json"
          cosign signing-config create --out "$SIG_CFG" >/dev/null
          jq 'del(.rekorTlogUrls)' "$SIG_CFG" > "${SIG_CFG}.tmp" && mv "${SIG_CFG}.tmp" "$SIG_CFG"
          echo "COSIGN_SIGNING_CONFIG=$SIG_CFG" >> "$GITHUB_ENV"

      # Sign the bare binary FIRST, so its .bundle travels inside the
      # tarball. Users who extract and keep only the binary can still
      # verify with the .bundle that came alongside it.
      - name: Sign bare binary
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TARGET: ${{ matrix.target }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            BIN_PATH="target/${TARGET}/release/vidaimock.exe"
          else
            BIN_PATH="target/${TARGET}/release/vidaimock"
          fi
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$KEY_FILE"
          cosign sign-blob --yes \
            --signing-config "$COSIGN_SIGNING_CONFIG" \
            --key "$KEY_FILE" \
            --bundle "${BIN_PATH}.bundle" \
            "$BIN_PATH"

      - name: Package tarball
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          PKG_DIR="vidaimock"
          mkdir -p "$PKG_DIR"
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            cp "target/${TARGET}/release/vidaimock.exe" "$PKG_DIR/"
            cp "target/${TARGET}/release/vidaimock.exe.bundle" "$PKG_DIR/"
          else
            cp "target/${TARGET}/release/vidaimock" "$PKG_DIR/"
            cp "target/${TARGET}/release/vidaimock.bundle" "$PKG_DIR/"
          fi
          cp -r config examples README.md LICENSE CHANGELOG.md release-assets/cosign.pub "$PKG_DIR/"
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            7z a "${ARTIFACT_NAME}.${ARCHIVE_EXT}" "$PKG_DIR/"
          else
            tar -czf "${ARTIFACT_NAME}.${ARCHIVE_EXT}" "$PKG_DIR/"
          fi

      - name: Sign tarball
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$KEY_FILE"
          cosign sign-blob --yes \
            --signing-config "$COSIGN_SIGNING_CONFIG" \
            --key "$KEY_FILE" \
            --bundle "${ARTIFACT_NAME}.${ARCHIVE_EXT}.bundle" \
            "${ARTIFACT_NAME}.${ARCHIVE_EXT}"

      - name: Generate checksum
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            certutil -hashfile "${ARTIFACT_NAME}.${ARCHIVE_EXT}" SHA256 | grep -v "hash" | head -n 1 > "${ARTIFACT_NAME}.sha256"
          else
            shasum -a 256 "${ARTIFACT_NAME}.${ARCHIVE_EXT}" > "${ARTIFACT_NAME}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.bundle
            ${{ matrix.artifact_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
